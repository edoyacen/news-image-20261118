<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wednesday 18 November 2026</title>
<style>
  @page { size: 1024px 1024px; margin: 0; }
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; background: #f7f3ea; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset="1" stop-color="#8ec6e4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8dcc4"/>
      <stop offset="1" stop-color="#d9c9a8"/>
    </linearGradient>
    <radialGradient id="hit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7043" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7043" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#f7f3ea"/>

  <!-- masthead -->
  <rect x="0" y="0" width="1024" height="8" fill="#111"/>
  <text x="48" y="72" font-size="34" font-weight="700" letter-spacing="1" fill="#111">THE DAY</text>
  <text x="976" y="66" font-size="15" letter-spacing="3" text-anchor="end" fill="#7a6f5d" font-family="Arial, Helvetica, sans-serif">WEDNESDAY 18 NOVEMBER 2026</text>
  <text x="976" y="88" font-size="12" letter-spacing="2.4" text-anchor="end" fill="#9a8f7c" font-family="Arial, Helvetica, sans-serif">ONE PICTURE · WORLD NEWS</text>
  <line x1="48" y1="104" x2="976" y2="104" stroke="#111" stroke-width="2.5"/>
  <line x1="48" y1="110" x2="976" y2="110" stroke="#111" stroke-width="1"/>

  <!-- lead headline -->
  <text x="48" y="196" font-size="63" font-weight="700" fill="#111">Iran strikes Kuwait and</text>
  <text x="48" y="262" font-size="63" font-weight="700" fill="#111">Bahrain as Trump, Xi and</text>
  <text x="48" y="328" font-size="63" font-weight="700" fill="#111">Putin meet in Beijing</text>

  <!-- standfirst -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#3d372c">
    <text x="48" y="368">Missiles reach the Gulf after American strikes on an island in the Strait of Hormuz; APEC</text>
    <text x="48" y="392">hands the three leaders one stage, and Manila walks away with a trade deal.</text>
  </g>

  <!-- illustration panel -->
  <g transform="translate(48,424)">
    <rect x="0" y="0" width="928" height="360" fill="url(#sea)"/>
    <!-- arabian shore -->
    <path d="M0 150 L150 168 L300 206 L430 262 L520 300 L560 330 L640 336 L700 360 L0 360 Z" fill="url(#sand)"/>
    <path d="M0 150 L150 168 L300 206 L430 262 L520 300 L560 330 L640 336 L700 360" fill="none" stroke="#a68e63" stroke-width="2"/>
    <!-- iranian shore -->
    <path d="M0 0 H928 V96 L800 86 L700 62 L600 34 L520 12 L470 0 Z" fill="url(#sand)"/>
    <path d="M0 0 H928 V96 L800 86 L700 62 L600 34 L520 12 L470 0" fill="none" stroke="#a68e63" stroke-width="2"/>

    <!-- impact blooms -->
    <circle cx="196" cy="176" r="66" fill="url(#hit)"/>
    <circle cx="470" cy="268" r="58" fill="url(#hit)"/>
    <circle cx="700" cy="120" r="96" fill="url(#hit)"/>

    <!-- trajectories from the iranian coast -->
    <g stroke="#d93a1f" stroke-width="3.4" fill="none" stroke-linecap="round">
      <path d="M700 120 C560 128 330 156 200 174"/>
      <path d="M700 120 C600 190 520 240 476 264"/>
      <path d="M696 128 C640 220 600 300 566 328"/>
    </g>
    <g fill="#8c1f0c">
      <circle cx="196" cy="176" r="8"/><circle cx="470" cy="268" r="8"/><circle cx="564" cy="328" r="8"/>
      <circle cx="700" cy="120" r="10"/>
    </g>

    <!-- labels -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6" fill="#5c4a2e">
      <text x="18" y="138">KUWAIT</text>
      <text x="404" y="248">BAHRAIN</text>
      <text x="500" y="316">QATAR</text>
      <text x="760" y="60">IRAN</text>
      <text x="18" y="340">SAUDI ARABIA</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing="2.6" fill="#0f647f">
      <text x="360" y="196">STRAIT OF HORMUZ</text>
    </g>
    <text x="700" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#8c1f0c" text-anchor="middle">STRIKES</text>
  </g>

  <!-- second deck -->
  <line x1="48" y1="812" x2="976" y2="812" stroke="#111" stroke-width="1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="13" font-weight="700" letter-spacing="1.6" fill="#a2401f">
      <text x="48" y="846">WASHINGTON</text>
      <text x="288" y="846">MARKETS</text>
      <text x="478" y="846">CULTURE</text>
      <text x="708" y="846">CLIMATE</text>
    </g>
    <g font-size="15.5" fill="#241f18">
      <text x="48" y="874">Jeffries nominated</text>
      <text x="48" y="896">for Speaker; Alaska</text>
      <text x="48" y="918">flips Senate to 56–44</text>

      <text x="288" y="874">Nvidia’s sales soar</text>
      <text x="288" y="896">again; Waymo pulls</text>
      <text x="288" y="918">robotaxis from freeways</text>

      <text x="478" y="874">Critics call GTA 6</text>
      <text x="478" y="896">a masterpiece on</text>
      <text x="478" y="918">its launch night</text>

      <text x="708" y="874">Talks in Beijing put</text>
      <text x="708" y="896">a price on shipping</text>
      <text x="708" y="918">through the Strait</text>
    </g>
  </g>

  <line x1="48" y1="944" x2="976" y2="944" stroke="#c9bda6" stroke-width="1"/>
  <text x="48" y="972" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="1.6" fill="#8a7f6b">SOURCES: BBC WORLD SERVICE · GOOGLE NEWS, 18 NOVEMBER 2026</text>
  <text x="976" y="972" font-family="Arial, Helvetica, sans-serif" font-size="11.5" letter-spacing="1.6" fill="#8a7f6b" text-anchor="end">DRAWN FROM THE DAY’S REPORTING</text>
</svg>
</body>
</html>
